      <script>
        window.__timelines = window.__timelines || {};

        var tl = gsap.timeline({ paused: true });

        /* ============ Scene 1 (0.0–1.8) — "track every pound of gain" ============
           Phone rises centered and settles (spring-pop-entrance, smooth power3
           long-tail — no overshoot); sun bloom suffuses in behind it; the gold
           ADG callout chip fades in beside the on-screen stat. */

        // Bloom breathes in first — atmosphere before structure.
        tl.fromTo(
          "#f04-bloom",
          { opacity: 0, scale: 0.88 },
          { opacity: 0.8, scale: 1, duration: 0.9, ease: "power2.out" },
          0.05
        );

        // Phone rises from the lower edge; visible well before t=0.5s.
        tl.fromTo(
          "#f04-phone",
          { y: 560, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.85, ease: "power3.out" },
          0.1
        );

        // Gold callout chip lands beside the phone (discrete-text-sequence
        // slide-up crossfade entrance), then its hairline connector draws
        // toward the ADG stat on screen.
        tl.fromTo(
          "#f04-callout",
          { y: 26, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
          1.05
        );
        tl.fromTo(
          "#f04-connector",
          { scaleX: 0, opacity: 1 },
          { scaleX: 1, opacity: 1, duration: 0.35, ease: "power2.out" },
          1.35
        );

        /* ============ Scene 2 (1.8–3.6) — "exactly where every pig stands" ============
           The screen content scrolls up inside the clipped shell (3d-page-scroll
           mechanics: translateY within the shell window, power3.out landing) so
           the Pace-vs-Target gauge lands centered in the cutout; concurrently the
           camera pushes in toward it (multi-phase-camera push, coordinate-target
           form: outer scales, inner counter-translates; gauge sits at frame
           center by layout so the counter-shift is a small vertical trim) and a
           gold accent underlines the gauge's green zone. */

        // Connector points at content that is about to scroll away — retire it
        // as the scroll begins (internal swap, not a frame exit).
        tl.to("#f04-connector", { opacity: 0, duration: 0.3, ease: "power1.out" }, 1.82);

        // Screen scroll: gauge region (display y≈406 in the 622px viewport)
        // lands at the viewport's vertical center. Single tween, power3.out.
        tl.to(
          "#f04-scroll",
          { y: -95, duration: 1.35, ease: "power3.out" },
          1.85
        );

        // Camera push — scale + counter-translate share duration AND ease.
        // Peak keeps the phone bottom above the caption keep-out (y < 896).
        tl.to(
          "#f04-cam-outer",
          { scale: 1.18, duration: 1.6, ease: "power2.inOut" },
          1.9
        );
        tl.to(
          "#f04-cam-inner",
          { y: -8, duration: 1.6, ease: "power2.inOut" },
          1.9
        );

        // Gold "on target" underline sweeps beneath the gauge's green zone
        // once the scroll has landed (css-marker-patterns, highlight sweep).
        tl.fromTo(
          "#f04-underline",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.5, ease: "power2.out" },
          3.2
        );

        /* ============ Scene 3 (3.6–5.0) — "days out from the show" ============
           Navy 25-days chip reveals beside the phone (echoing the screen's own
           copy); the bloom swells softly behind the phone (ambient-glow-bloom,
           bloom-and-hold — no breathe loop); camera has eased to a stop. HOLD. */

        tl.fromTo(
          "#f04-days",
          { y: 26, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
          3.75
        );

        // Soft glow bloom behind the phone — one swell, then still to the end.
        tl.to(
          "#f04-bloom",
          { opacity: 1, scale: 1.07, duration: 0.9, ease: "power2.out" },
          3.95
        );
