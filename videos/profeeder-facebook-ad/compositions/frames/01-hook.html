<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 1 — Won at chore time (hook, kinetic-type-beats sub-shape A: fixed-line token swap) -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
  font-family: 'Instrument Serif';
  font-style: italic;
  font-weight: 400;
  font-display: swap;
  src: url(assets/fonts/InstrumentSerif-italic-0.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Instrument Serif';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url(assets/fonts/InstrumentSerif-1.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400 800;
  font-display: swap;
  src: url(assets/fonts/Inter-2.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url(assets/fonts/JetBrainsMono-3.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1080px;
          overflow: hidden;
          container-type: size;
          font-family: "Instrument Serif", serif;
        }

        /* Full-bleed navy ink field — dedicated clip layer, never on the root */
        .f1-bg {
          position: absolute;
          inset: 0;
          background: #0d1b2e;
        }

        /* Subtle gold bloom — the frame's one atmospheric depth layer */
        .f1-bloom {
          position: absolute;
          left: 50%;
          top: 40%;
          width: 980px;
          height: 980px;
          margin-left: -490px;
          margin-top: -490px;
          background: radial-gradient(
            circle at center,
            rgba(232, 182, 76, 0.16) 0%,
            rgba(217, 164, 65, 0.07) 42%,
            rgba(13, 27, 46, 0) 70%
          );
          opacity: 0;
        }

        /* Content sits inside the top ~83% band (bottom 184px kept clear) */
        .f1-stage {
          position: absolute;
          inset: 0 0 184px 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .f1-headline {
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
        }

        .f1-line1 {
          font-size: 92px;
          font-weight: 400;
          line-height: 1.06;
          letter-spacing: -0.005em;
          color: #faf6ec;
          white-space: nowrap;
        }

        .f1-line1 .f1-w {
          display: inline-block;
        }

        /* Line 2 — the variable slot. Both variants stack in the same cell. */
        .f1-line2 {
          position: relative;
          margin-top: 26px;
          width: 100%;
          height: 150px;
        }

        .f1-slot {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .f1-slot-inner {
          display: inline-block;
          white-space: nowrap;
        }

        .f1-slot-a .f1-slot-text {
          font-size: 92px;
          font-weight: 400;
          line-height: 1.06;
          letter-spacing: -0.005em;
          color: #faf6ec;
        }

        .f1-slot-a .f1-slot-text .f1-w {
          display: inline-block;
        }

        .f1-slot-b {
          opacity: 0;
          visibility: hidden;
        }

        .f1-slot-b .f1-slot-text {
          font-size: 104px;
          font-style: italic;
          font-weight: 400;
          line-height: 1.06;
          letter-spacing: -0.005em;
          color: #e8b64c;
        }

        /* Drawn gold underline — 1px-family hairline scaled up for display weight */
        .f1-rule {
          display: block;
          height: 5px;
          margin-top: 16px;
          background: #e8b64c;
          transform-origin: left center;
        }

        .f1-rule-a {
          transform: scaleX(0);
        }
      </style>

      <div
        id="root"
        data-composition-id="01-hook"
        data-width="1080"
        data-height="1080"
      >
        <div
          class="clip f1-bg"
          id="f1-bg"
          data-start="0"
          data-duration="3.669"
          data-track-index="0"
        >
          <div class="f1-bloom" id="f1-bloom"></div>
        </div>

        <div
          class="clip f1-stage"
          id="f1-stage"
          data-start="0"
          data-duration="3.669"
          data-track-index="1"
        >
          <div class="f1-headline">
            <div class="f1-line1" id="f1-line1"
              ><span class="f1-w">Banners</span>&nbsp;<span class="f1-w">aren&rsquo;t</span>&nbsp;<span class="f1-w">won</span></div
            >
            <div class="f1-line2">
              <!-- Variant A: "on show day." -->
              <div class="f1-slot f1-slot-a" id="f1-slot-a">
                <span class="f1-slot-inner">
                  <span class="f1-slot-text" id="f1-slot-a-text"
                    ><span class="f1-w">on</span>&nbsp;<span class="f1-w">show</span>&nbsp;<span class="f1-w">day.</span></span
                  >
                  <span class="f1-rule f1-rule-a" id="f1-rule-a"></span>
                </span>
              </div>
              <!-- Variant B: "at chore time." — gold italic, slightly larger -->
              <div class="f1-slot f1-slot-b" id="f1-slot-b">
                <span class="f1-slot-inner">
                  <span class="f1-slot-text">at chore time.</span>
                  <span class="f1-rule" id="f1-rule-b"></span>
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        /* ---- Scene 1 (0.0–1.4s) — "Banners aren't won" per-word staggered
           reveal (dynamic-content-sequencing / per-word fade+blur), smooth
           long-tail power3 settle. Hero visible by ~0.15s. ---- */
        tl.fromTo(
          "#f1-line1 .f1-w",
          { opacity: 0, y: 34, filter: "blur(8px)" },
          {
            opacity: 1,
            y: 0,
            filter: "blur(0px)",
            duration: 0.85,
            ease: "power3.out",
            stagger: 0.16,
          },
          0.1,
        );

        /* Gold bloom breathes in underneath — atmosphere, camera stays locked */
        tl.fromTo(
          "#f1-bloom",
          { opacity: 0 },
          { opacity: 1, duration: 1.1, ease: "power2.out" },
          0.2,
        );

        /* ---- Scene 2 (1.4–2.2s) — the phrase completes: "on show day."
           lands in the variable slot, per-word; a drawn gold underline
           sweeps left→right beneath it (css-marker-patterns highlight). ---- */
        tl.fromTo(
          "#f1-slot-a-text .f1-w",
          { opacity: 0, y: 26, filter: "blur(6px)" },
          {
            opacity: 1,
            y: 0,
            filter: "blur(0px)",
            duration: 0.55,
            ease: "power3.out",
            stagger: 0.09,
          },
          1.4,
        );

        tl.fromTo(
          "#f1-rule-a",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.48, ease: "power2.out" },
          1.66,
        );

        /* ---- Scene 3 (2.2–3.669s) — the signature move: the slot
           hard-cuts in place (discrete-text-sequence). "on show day." →
           "at chore time." in gold italic, slightly larger; the underline
           snaps to the new width in the same instant. Then dead still. ---- */
        const T_SWAP = 2.24;
        tl.set("#f1-slot-a", { autoAlpha: 0 }, T_SWAP);
        tl.set("#f1-slot-b", { autoAlpha: 1 }, T_SWAP);
        /* From the swap to the end of the frame: dead still (per storyboard). */

        window.__timelines["01-hook"] = tl;
      </script>
    </template>
  </body>
</html>
