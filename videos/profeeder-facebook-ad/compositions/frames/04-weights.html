<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Frame 04 — Know every pig</title>
    <!-- head is source-file metadata only; runtime clones <template> contents -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Inter';
          font-style: normal;
          font-weight: 400 800;
          font-display: swap;
          src: url(assets/fonts/Inter-2.woff2) format('woff2');
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
          font-family: 'JetBrains Mono';
          font-style: normal;
          font-weight: 400 700;
          font-display: swap;
          src: url(assets/fonts/JetBrainsMono-3.woff2) format('woff2');
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        /* Root styled via #root, never a class on the composition root */
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1080px;
          overflow: hidden;
          container-type: size;
          font-family: "Inter", sans-serif;
          color: #0d1b2e;
        }

        /* ---------- ground: cream field (full-bleed clip, never on #root) ---------- */
        .f04-bg {
          position: absolute;
          inset: 0;
          background: #faf6ec;
        }
        /* subordinate ember counter-bloom, bottom-left (atmosphere only, bleeds) */
        .f04-ember {
          position: absolute;
          left: -240px;
          bottom: -260px;
          width: 640px;
          height: 640px;
          border-radius: 50%;
          background: radial-gradient(
            circle,
            rgba(217, 164, 65, 0.16) 0%,
            rgba(217, 164, 65, 0.07) 45%,
            rgba(217, 164, 65, 0) 70%
          );
          pointer-events: none;
        }

        /* ---------- stage + virtual camera ---------- */
        .f04-stage {
          position: absolute;
          inset: 0;
          overflow: hidden; /* camera scale must clip at the frame */
        }
        /* coordinate-target-zoom: OUTER scales, INNER counter-translates */
        #f04-cam-outer {
          position: absolute;
          inset: 0;
          transform-origin: 50% 50%;
          will-change: transform;
        }
        #f04-cam-inner {
          position: absolute;
          inset: 0;
          will-change: transform;
        }

        /* sun-bloom behind the phone — the frame's one bloom; scene 3 swells it */
        #f04-bloom {
          position: absolute;
          left: 150px;
          top: 96px;
          width: 780px;
          height: 780px;
          border-radius: 50%;
          background: radial-gradient(
            circle,
            rgba(232, 182, 76, 0.30) 0%,
            rgba(243, 216, 160, 0.14) 46%,
            rgba(238, 202, 126, 0) 72%
          );
          transform-origin: 50% 50%;
          will-change: transform, opacity;
          pointer-events: none;
        }

        /* ---------- phone: authored shell, screens ARE the real screenshots ---------- */
        #f04-phone {
          position: absolute;
          left: 342px;
          top: 140px;
          width: 396px;
          height: 692px;
          will-change: transform, opacity;
        }
        .f04-shell {
          position: absolute;
          inset: 0;
          background: #16263c;
          border: 1px solid rgba(250, 246, 236, 0.4);
          border-radius: 30px;
          padding: 13px;
        }
        .f04-screen {
          position: relative;
          width: 100%;
          height: 100%;
          background: #ffffff;
          border-radius: 20px;
          overflow: hidden; /* clip at the shell — screens cycle past this window */
        }
        /* authored status strip above the app content (shell chrome, not screenshot) */
        .f04-status {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 44px;
          background: #ffffff;
          z-index: 2;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 22px;
        }
        .f04-status-time {
          font-family: "Inter", sans-serif;
          font-size: 14px;
          font-weight: 600;
          color: #0d1b2e;
        }
        .f04-status-right {
          display: flex;
          align-items: flex-end;
          gap: 8px;
        }
        .f04-sig {
          display: flex;
          align-items: flex-end;
          gap: 2px;
        }
        .f04-sig i {
          display: block;
          width: 3px;
          background: #0d1b2e;
          border-radius: 1px;
        }
        .f04-sig i:nth-child(1) { height: 4px; }
        .f04-sig i:nth-child(2) { height: 7px; }
        .f04-sig i:nth-child(3) { height: 10px; }
        .f04-sig i:nth-child(4) { height: 13px; }
        .f04-batt {
          position: relative;
          width: 24px;
          height: 12px;
          border: 1.5px solid #0d1b2e;
          border-radius: 3px;
        }
        .f04-batt i {
          position: absolute;
          left: 2px;
          top: 2px;
          bottom: 2px;
          width: 14px;
          background: #0d1b2e;
          border-radius: 1px;
          display: block;
        }

        /* clipped viewport the screen cycle runs inside (370 x 622) */
        .f04-viewport {
          position: absolute;
          top: 44px;
          left: 0;
          right: 0;
          bottom: 0;
          overflow: hidden;
        }
        /* screen-cycling stack: two full-viewport slots stacked vertically.
           Advancing = one translateY of the whole stack (3d-page-scroll
           mechanics) so the outgoing and incoming screens share one
           velocity — the seam is velocity-matched by construction. */
        #f04-cycle {
          position: absolute;
          top: 0;
          left: 0;
          width: 370px;
          height: 1244px; /* 2 x 622 */
          will-change: transform;
        }
        .f04-slot {
          position: absolute;
          left: 0;
          width: 370px;
          height: 622px;
          overflow: hidden; /* each screenshot is taller than its slot */
        }
        #f04-slot-profile { top: 0; }
        #f04-slot-adg { top: 622px; }
        /* both PNGs are 720x1464 -> 370x752 at display width */
        .f04-slot img {
          position: absolute;
          left: 0;
          display: block;
          width: 370px;
          height: 752px;
        }
        /* profile: top-aligned so Lucy's header + all four stat cards read
           (cards end at display y~497, inside the 622px slot) */
        #f04-shot-profile { top: 0; }
        /* details: shifted up so the "Pace vs Target ADG" gauge region
           (~52-66% down the image, display y ~391-497) sits centered in
           the slot: gauge-region center 444 - slot center 311 = 133 */
        #f04-shot-adg { top: -133px; }
        /* gold "on target" underline beneath the gauge's green zone — lives
           in the adg slot so it stays glued to the gauge (css-marker-patterns
           highlight sweep; green zone = display x 152..297, bar bottom y 281) */
        #f04-underline {
          position: absolute;
          left: 152px;
          top: 288px;
          width: 145px;
          height: 5px;
          background: #e8b64c;
          border-radius: 3px;
          transform-origin: left center;
          will-change: transform;
        }

        /* ---------- gold callout chip (scene 1, left of phone) ----------
           Points at the on-screen "ADG (3 weights) 1.74 lbs" stat card
           (world y ~616-694); retires with the screen advance. */
        #f04-callout {
          position: absolute;
          left: 110px;
          top: 600px;
          width: 214px;
          background: #e8b64c;
          padding: 14px 18px;
          will-change: transform, opacity;
        }
        .f04-callout-label {
          font-family: "Inter", sans-serif;
          font-size: 12px;
          font-weight: 600;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: #0d1b2e;
          opacity: 0.75;
        }
        .f04-callout-value {
          font-family: "JetBrains Mono", monospace;
          font-size: 22px;
          font-weight: 700;
          letter-spacing: 0.02em;
          color: #0d1b2e;
          margin-top: 5px;
          white-space: nowrap;
        }
        /* hairline connector pointing at the ADG stat card on screen */
        #f04-connector {
          position: absolute;
          left: 324px;
          top: 638px;
          width: 36px;
          height: 1px;
          background: rgba(13, 27, 46, 0.6);
          transform-origin: left center;
          will-change: transform, opacity;
        }

        /* ---------- navy days-to-show chip (scene 3, left of phone) ----------
           Placed inside the final camera window (world x 198..882, y 268..952
           at peak scale 1.58 + inner y -70) so it stays fully in frame. */
        #f04-days {
          position: absolute;
          left: 210px;
          top: 620px;
          width: 126px;
          background: #0d1b2e;
          padding: 16px 16px 15px;
          will-change: transform, opacity;
        }
        .f04-days-num {
          font-family: "JetBrains Mono", monospace;
          font-size: 44px;
          font-weight: 700;
          line-height: 1;
          color: #e8b64c;
        }
        .f04-days-label {
          font-family: "Inter", sans-serif;
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          line-height: 1.45;
          color: #faf6ec;
          margin-top: 8px;
        }
      </style>

      <!-- root duration = clip 5.525 + 0.5 sibling convention -->
      <div id="root" data-composition-id="04-weights" data-width="1080" data-height="1080" data-duration="6.331">
        <!-- ground -->
        <div class="clip f04-bg" data-start="0" data-duration="5.931" data-track-index="0">
          <div class="f04-ember"></div>
        </div>

        <!-- stage under the virtual camera -->
        <div class="clip f04-stage" data-start="0" data-duration="5.931" data-track-index="1">
          <div id="f04-cam-outer">
            <div id="f04-cam-inner">
              <!-- sun bloom (depth layer, behind the phone) -->
              <div id="f04-bloom"></div>

              <!-- phone: TWO real screens cycling inside the authored shell -->
              <div id="f04-phone">
                <div class="f04-shell">
                  <div class="f04-screen">
                    <div class="f04-status">
                      <span class="f04-status-time">9:41</span>
                      <span class="f04-status-right">
                        <span class="f04-sig"><i></i><i></i><i></i><i></i></span>
                        <span class="f04-batt"><i></i></span>
                      </span>
                    </div>
                    <div class="f04-viewport">
                      <!-- screen-cycling stack: deliberately taller than the viewport -->
                      <div id="f04-cycle" data-layout-allow-overflow="">
                        <div class="f04-slot" id="f04-slot-profile" data-layout-allow-overflow="">
                          <img id="f04-shot-profile" src="assets/screen-pig-profile.png" alt="">
                        </div>
                        <div class="f04-slot" id="f04-slot-adg" data-layout-allow-overflow="">
                          <img id="f04-shot-adg" src="assets/screen-pig-details-adg.png" alt="">
                          <div id="f04-underline"></div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- gold callout chip + hairline connector (scene 1) -->
              <div id="f04-callout">
                <div class="f04-callout-label">Avg daily gain</div>
                <div class="f04-callout-value">+1.74 lbs/day</div>
              </div>
              <div id="f04-connector"></div>

              <!-- navy days-to-show chip (scene 3) -->
              <div id="f04-days">
                <div class="f04-days-num">25</div>
                <div class="f04-days-label">Days to show</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        var tl = gsap.timeline({ paused: true });

        /* ============ Scene 1 (0.0–2.2) — "track every pound of gain" ============
           Phone rises centered showing the REAL Lucy profile screen (header +
           four stat cards, top-aligned) and settles (spring-pop-entrance,
           smooth power3 long-tail — no overshoot); sun bloom suffuses in
           behind it; the gold "+1.74 lbs/day" callout chip fades in beside the
           on-screen ADG stat (discrete-text-sequence slide-up crossfade). The
           continual camera push begins underneath. */

        // Bloom breathes in first — atmosphere before structure.
        tl.fromTo(
          "#f04-bloom",
          { opacity: 0, scale: 0.88 },
          { opacity: 0.8, scale: 1, duration: 0.9, ease: "power2.out" },
          0.05
        );

        // Phone rises from the lower edge; visible well before t=0.5s.
        tl.fromTo(
          "#f04-phone",
          { y: 560, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.85, ease: "power3.out" },
          0.1
        );

        // Continual camera push, phase A — a gentle drift-in while the profile
        // screen is read (multi-phase-camera, steady-push pattern).
        tl.to(
          "#f04-cam-outer",
          { scale: 1.07, duration: 1.9, ease: "power1.inOut" },
          0.15
        );

        // Gold callout chip lands beside the phone, then its hairline
        // connector draws toward the ADG stat card on screen.
        tl.fromTo(
          "#f04-callout",
          { y: 26, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
          1.1
        );
        tl.fromTo(
          "#f04-connector",
          { scaleX: 0, opacity: 1 },
          { scaleX: 1, opacity: 1, duration: 0.35, ease: "power2.out" },
          1.4
        );

        /* ============ Scene 2 (2.2–3.8) — "exactly where every pig stands" ============
           The SCREEN ADVANCES: the profile screen pushes up and out as the
           real Pace-vs-Target gauge screen pushes in from below inside the
           clipped shell — one translateY on the shared stack (3d-page-scroll
           mechanics), so the internal seam is velocity-matched. The camera
           keeps closing on the gauge (multi-phase-camera phase B +
           coordinate-target-zoom: outer scales, inner counter-translates,
           shared duration AND ease); a gold accent underlines the gauge's
           green "on target" zone (css-marker-patterns highlight sweep). */

        // The scene-1 annotation retires WITH the advance (same upward
        // velocity direction as the outgoing screen — an internal swap per
        // the cut catalog, not a frame exit).
        tl.to(
          "#f04-callout",
          { y: -44, opacity: 0, duration: 0.45, ease: "power2.in" },
          2.25
        );
        tl.to("#f04-connector", { opacity: 0, duration: 0.3, ease: "power1.out" }, 2.25);

        // Screen advance: stack moves exactly one viewport height (622px),
        // landing the gauge region centered in the shell cutout.
        tl.to(
          "#f04-cycle",
          { y: -622, duration: 1.25, ease: "power3.inOut" },
          2.25
        );

        // Camera push, phase B — closes to 1.58 by the hold; the inner
        // counter-translate (same window, same ease) trims the framing down
        // so the phone bottom maps to y≈891 < 896 (caption keep-out) at peak.
        tl.to(
          "#f04-cam-outer",
          { scale: 1.58, duration: 3.15, ease: "power1.inOut" },
          2.05
        );
        tl.to(
          "#f04-cam-inner",
          { y: -70, duration: 3.15, ease: "power1.inOut" },
          2.05
        );

        // Gold underline sweeps beneath the gauge's green zone once the
        // advance has landed.
        tl.fromTo(
          "#f04-underline",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.5, ease: "power2.out" },
          3.55
        );

        /* ============ Scene 3 (3.8–5.2) — "days out from the show" ============
           Navy 25-days chip reveals beside the phone (echoing the gauge
           screen's own "25 days from last weight to show"); the bloom swells
           softly once (ambient-glow-bloom, hero-bloom form — no breathe
           loop); the camera eases to a stop at 5.2. HOLD still. */

        tl.fromTo(
          "#f04-days",
          { y: 26, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
          3.85
        );

        // Soft glow bloom behind the phone — one swell, then still to the end.
        tl.to(
          "#f04-bloom",
          { opacity: 1, scale: 1.07, duration: 0.9, ease: "power2.out" },
          4.1
        );

        window.__timelines["04-weights"] = tl;
      </script>
    </template>
  </body>
</html>
