<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Frame 06 — Show day, dialed in</title>
    <!-- head is source-file metadata only; runtime clones <template> contents -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Inter';
          font-style: normal;
          font-weight: 400 800;
          font-display: swap;
          src: url(assets/fonts/Inter-2.woff2) format('woff2');
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
          font-family: 'JetBrains Mono';
          font-style: normal;
          font-weight: 400 700;
          font-display: swap;
          src: url(assets/fonts/JetBrainsMono-3.woff2) format('woff2');
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        /* Root styled by #root (never a class on the composition root) */
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1080px;
          overflow: hidden;
          container-type: size;
          font-family: "Inter", sans-serif;
          color: #0d1b2e;
        }

        /* Full-bleed ground lives on a clip layer, never on #root */
        .showday-scene {
          position: absolute;
          inset: 0;
          background: #faf6ec;
          overflow: hidden;
        }

        /* Static ember counter-bloom, bottom-right (opposite the sun bloom) */
        .showday-ember {
          position: absolute;
          right: -20%;
          bottom: -24%;
          width: 56%;
          height: 56%;
          background: radial-gradient(
            circle at 50% 50%,
            rgba(217, 164, 68, 0.18) 0%,
            rgba(217, 164, 68, 0.08) 45%,
            rgba(217, 164, 68, 0) 72%
          );
          pointer-events: none;
        }

        /* Camera wraps ALL content; transform written by GSAP onUpdate only */
        .showday-cam {
          position: absolute;
          inset: 0;
          transform-origin: 42% 44%; /* biased between the two slots */
          will-change: transform;
        }

        /* Sun bloom — the frame's one primary bloom, behind the phone slot */
        .showday-bloom {
          position: absolute;
          left: -8%;
          top: 4%;
          width: 72%;
          height: 72%;
          background: radial-gradient(
            circle at 50% 46%,
            rgba(232, 182, 76, 0.7) 0%,
            rgba(243, 216, 160, 0.48) 34%,
            rgba(238, 202, 126, 0.22) 58%,
            rgba(250, 246, 236, 0) 76%
          );
          transform-origin: 50% 50%;
          pointer-events: none;
          will-change: transform, opacity;
        }

        /* ── chrome ─────────────────────────────────────────────── */
        .showday-toplabel {
          position: absolute;
          left: 64px;
          top: 58px;
          font-family: "Inter", sans-serif;
          font-size: 13px;
          font-weight: 600;
          letter-spacing: 0.32em;
          text-transform: uppercase;
          color: #0d1b2e;
          padding-bottom: 12px;
          border-bottom: 1px solid rgba(13, 27, 46, 0.2);
          will-change: transform, opacity;
        }
        .showday-pagenum {
          position: absolute;
          right: 64px;
          top: 846px;
          font-family: "JetBrains Mono", monospace;
          font-size: 13px;
          letter-spacing: 0.08em;
          color: rgba(13, 27, 46, 0.75);
          will-change: opacity;
        }

        /* ── LEFT SLOT — real phone (navy shell), real Shows screen ── */
        .showday-phone {
          position: absolute;
          left: 96px;
          top: 176px;
          width: 384px;
          height: 608px;
          background: #0d1b2e;
          border-radius: 46px;
          padding: 12px;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
          z-index: 2;
        }
        .showday-phone-screen {
          position: relative;
          width: 360px;
          height: 584px;
          border-radius: 36px;
          overflow: hidden; /* excess screenshot clips at the shell bottom */
          background: #ced5df;
        }
        /* 720px-wide source at 0.5 scale; -40px offset crops the app title
           bar and frames "Upcoming Shows (2)" + both show cards with their
           "19 days" / "35 days" pills clearly inside the visible screen */
        .showday-phone-screen img {
          position: absolute;
          left: 0;
          top: -40px;
          width: 360px;
          display: block;
        }
        .showday-phone-notch {
          position: absolute;
          left: 50%;
          top: 24px;
          margin-left: -54px; /* center via margin — GSAP owns transforms */
          width: 108px;
          height: 26px;
          border-radius: 13px;
          background: #0d1b2e;
          z-index: 3;
        }

        /* Gold callout chip beside the McLean row — spring-pop accent.
           Screen top = 176+12 = 188; the McLean "19 days" pill sits
           ~y 112–140 inside the screen → canvas ~300–328. */
        .showday-chip {
          position: absolute;
          left: 452px;
          top: 312px;
          padding: 13px 20px;
          background: #e8b64c;
          transform-origin: 0% 50%; /* origin-anchored: grows out of the row */
          will-change: transform, opacity;
          z-index: 4;
          white-space: nowrap;
          font-family: "JetBrains Mono", monospace;
          font-size: 17px;
          font-weight: 700;
          letter-spacing: 0.1em;
          color: #0d1b2e;
        }

        /* ── RIGHT SLOT — real Teams & Collaboration card image ──── */
        /* 820×432 source mounted at ~44% canvas width (475px → ~250px tall) */
        .showday-card {
          position: absolute;
          left: 548px;
          top: 372px;
          width: 475px;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
          z-index: 2;
        }
        .showday-card img {
          display: block;
          width: 475px;
          height: auto;
          border: 1px solid #0d1b2e; /* ink hairline — the only border */
        }

        /* ── traveling gold sweep across the assembled pair ──────── */
        .showday-sweepwrap {
          position: absolute;
          left: 70px;
          top: 150px;
          width: 960px;
          height: 660px;
          overflow: hidden; /* clips the band to the two-up region */
          pointer-events: none;
          z-index: 5;
        }
        .showday-sweep {
          position: absolute;
          top: 0;
          bottom: 0;
          left: 0;
          width: 240px;
          background: linear-gradient(
            105deg,
            rgba(232, 182, 76, 0) 0%,
            rgba(232, 182, 76, 0.55) 50%,
            rgba(232, 182, 76, 0) 100%
          );
          opacity: 0;
          pointer-events: none;
          will-change: transform, opacity;
        }
      </style>

      <div id="root" data-composition-id="06-showday" data-width="1080" data-height="1080" data-duration="3.444">
        <div class="showday-scene clip" data-start="0" data-duration="2.944" data-track-index="0">
          <div class="showday-ember"></div>

          <div class="showday-cam" id="showday-cam">
            <div class="showday-bloom" id="showday-bloom"></div>

            <div class="showday-toplabel" id="showday-toplabel">Show day, dialed in</div>
            <div class="showday-pagenum" id="showday-pagenum">06 · PROFEEDER</div>

            <!-- LEFT — real phone with the Shows / countdown screen -->
            <div class="showday-phone" id="showday-phone">
              <div class="showday-phone-notch"></div>
              <div class="showday-phone-screen">
                <img id="showday-screen-img" src="assets/screen-shows.png" alt="">
              </div>
            </div>

            <!-- gold callout chip beside the McLean county fair row -->
            <div class="showday-chip" id="showday-chip">19 DAYS OUT</div>

            <!-- RIGHT — real Teams & Collaboration card image -->
            <div class="showday-card" id="showday-card">
              <img id="showday-card-img" src="assets/card-teams.png" alt="">
            </div>

            <!-- single traveling gold glow across the pair -->
            <div class="showday-sweepwrap">
              <div class="showday-sweep" id="showday-sweep"></div>
            </div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const DUR = 2.944;

        /* ── Scene 1 (0.0–1.5s): "every show" — the Shows phone assembles
               into the LEFT slot (center-outward-expansion, direct-into-slot
               form: fade + short slide into place, landed by ~0.5s); the
               gold "19 DAYS OUT" chip spring-pops beside the McLean row ── */

        // sun bloom establishes early (frame never reads flat)
        tl.fromTo(
          "#showday-bloom",
          { opacity: 0, scale: 0.94 },
          { opacity: 0.55, scale: 1, duration: 0.8, ease: "power2.out" },
          0
        );

        // chrome settles in quietly
        tl.fromTo(
          "#showday-toplabel",
          { opacity: 0, y: -10 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
          0.05
        );
        tl.fromTo(
          "#showday-pagenum",
          { opacity: 0 },
          { opacity: 1, duration: 0.35, ease: "power1.out" },
          0.1
        );

        // phone: short slide directly into its slot, settled level by ~0.5s
        tl.fromTo(
          "#showday-phone",
          { opacity: 0, x: -60, y: 28, rotation: -2.5, scale: 0.94 },
          {
            opacity: 1,
            x: 0,
            y: 0,
            rotation: 0,
            scale: 1,
            duration: 0.5,
            ease: "power3.out",
          },
          0.05
        );

        // spring-pop-entrance (origin-anchored, firm settle): the gold chip
        // grows out of the McLean row — fromTo, power3.out, no overshoot
        tl.fromTo(
          "#showday-chip",
          { opacity: 0, scale: 0, y: 10 },
          { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.75
        );

        /* ── Scene 2 (1.5–2.4s): on "counted down" — the real Teams &
               Collaboration card assembles into the RIGHT slot the same
               way, settled by ~1.9s — the whole show team stays synced ── */

        tl.fromTo(
          "#showday-card",
          { opacity: 0, x: 60, y: 28, rotation: 2.5, scale: 0.94 },
          {
            opacity: 1,
            x: 0,
            y: 0,
            rotation: 0,
            scale: 1,
            duration: 0.55,
            ease: "power3.out",
          },
          1.5
        );

        /* ── Scene 3 (2.4–2.944s): on "dialed in" — both settle level and
               HOLD; ambient-glow-bloom (traveling form) — ONE gold pass
               across the pair, then it dies out. No exit tween. ── */

        // single finite pass: band enters fully off the left edge of the
        // clipped region and exits fully off the right; no loop, no return
        tl.fromTo(
          "#showday-sweep",
          { x: -260, opacity: 0 },
          { x: 1000, opacity: 0.22, duration: 0.55, ease: "none" },
          2.3
        );
        // trailing fade so the band dies out exactly as it clears the edge
        tl.to(
          "#showday-sweep",
          { opacity: 0, duration: 0.14, ease: "power1.in" },
          2.8
        );

        /* ── one gentle camera push under Scenes 2–3, easing to a stop so
               the pair holds level to the end ── */

        const cam = document.getElementById("showday-cam");
        const phase = { s: 1 };
        tl.to(phase, { s: 1.08, duration: 1.5, ease: "power1.inOut" }, 1.2);
        // page chrome retires as the camera closes in (keeps the keep-out clean)
        tl.to("#showday-pagenum", { opacity: 0, duration: 0.35, ease: "power1.out" }, 2.35);

        // continuous deterministic micro-drift (Lissajous) + phase scale
        const drift = { p: 0 };
        tl.to(
          drift,
          {
            p: Math.PI * 2 * 0.8,
            duration: DUR,
            ease: "none",
            onUpdate: () => {
              const dx = Math.sin(drift.p) * 3;
              const dy = Math.sin(drift.p * 1.3) * 2;
              cam.style.transform =
                "scale(" + phase.s + ") translate(" + dx + "px, " + dy + "px)";
            },
          },
          0
        );

        window.__timelines["06-showday"] = tl;
      </script>
    </template>
  </body>
</html>
