<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>07-price — Start free.</title>
  </head>
  <body>
    <template>
      <style>
        @import url("https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap");

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1080px;
          overflow: hidden;
          container-type: size;
        }

        /* ---- full-bleed ground (own clip layer, never on #root) ---- */
        .p7-ground {
          position: absolute;
          inset: 0;
          background: #faf6ec;
        }
        .p7-sun-bloom {
          position: absolute;
          left: 50%;
          top: 42%;
          width: 940px;
          height: 940px;
          margin-left: -470px;
          margin-top: -470px;
          background: radial-gradient(
            circle at 50% 50%,
            rgba(232, 182, 76, 0.55) 0%,
            rgba(243, 216, 160, 0.5) 30%,
            rgba(238, 202, 126, 0.22) 55%,
            rgba(250, 246, 236, 0) 72%
          );
        }
        .p7-ember-bloom {
          position: absolute;
          left: -240px;
          bottom: -260px;
          width: 660px;
          height: 660px;
          background: radial-gradient(
            circle at 50% 50%,
            rgba(217, 164, 65, 0.18) 0%,
            rgba(217, 164, 65, 0.08) 45%,
            rgba(250, 246, 236, 0) 70%
          );
        }

        /* ---- stage ---- */
        .p7-stage {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: flex-start;
        }
        #p7-title {
          margin-top: 342px; /* optical center of the top-83% safe area */
          font-family: "Instrument Serif", serif;
          font-weight: 400;
          font-size: 150px;
          line-height: 1;
          letter-spacing: -0.018em;
          color: #0d1b2e;
          text-align: center;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }
        #p7-qual {
          margin-top: 52px;
          font-family: "JetBrains Mono", monospace;
          font-weight: 400;
          font-size: 26px;
          letter-spacing: 0.04em;
          color: #0d1b2e;
          text-align: center;
          white-space: nowrap;
          will-change: transform, opacity;
        }
        .p7-gold {
          color: #d9a441;
          font-weight: 500;
        }
        .p7-dot {
          opacity: 0.45;
          padding: 0 0.55em;
        }
      </style>

      <div id="root" data-composition-id="07-price" data-width="1080" data-height="1080">
        <!-- ground: paper + one sun bloom + subordinate ember counter-bloom -->
        <div
          class="clip p7-ground"
          data-start="0"
          data-duration="1.109"
          data-track-index="0"
        >
          <div class="p7-sun-bloom"></div>
          <div class="p7-ember-bloom"></div>
        </div>

        <!-- content stage -->
        <div
          class="clip p7-stage"
          data-start="0"
          data-duration="1.109"
          data-track-index="1"
        >
          <div id="p7-title">Start free.</div>
          <div id="p7-qual">
            <span class="p7-gold">$0</span> to start<span class="p7-dot">&middot;</span>Pro from $9/mo
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Scene 1 (0–0.16s): bare cream canvas — the allocated breather begins.
        // (Ground is static from t=0; nothing animates.)

        // Scene 2 (~0.16s): the ONE move — "Start free." fades in centered while
        // scaling 95% -> 100% on a smooth ease-out (restrained scale-swap entrance,
        // no bounce, no outgoing element).
        tl.fromTo(
          "#p7-title",
          { opacity: 0, scale: 0.95 },
          { opacity: 1, scale: 1, duration: 0.46, ease: "power2.out" },
          0.16
        );

        // Scene 3 (~0.62s): qualifier slides up from below center and crossfades in
        // beneath (discrete-text-sequence slide-up crossfade, single hand-off).
        tl.fromTo(
          "#p7-qual",
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" },
          0.62
        );

        // ~0.98s → end: dead-still hold. No second phase, no drift, no exit.

        window.__timelines["07-price"] = tl;
      </script>
    </template>
  </body>
</html>
