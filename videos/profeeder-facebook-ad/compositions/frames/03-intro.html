      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // Storyboard scene windows are written on a ~4.0s scale; this frame
        // runs 2.987s → compress ×0.747: Scene 1 ≈ 0–1.12, Scene 2 ≈ 1.12–2.09,
        // Scene 3 ≈ 2.09–2.987.

        /* ============ Scene 1 (0.0–1.12) — phone rises, gold disc resolves ============ */

        // Gold haze breathes in first — atmosphere before structure.
        tl.fromTo(
          "#i03-haze",
          { opacity: 0 },
          { opacity: 1, duration: 0.75, ease: "power2.out" },
          0.04
        );

        // Accent disc scales up behind the phone (scale-swap-transition,
        // restrained incoming form: grow + fade in, smooth settle, no overshoot).
        tl.fromTo(
          "#i03-disc",
          { scale: 0.55, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.62, ease: "power3.out" },
          0.06
        );

        // Phone slides up from the lower edge and settles (spring-pop-entrance,
        // smooth long-tail power3.out — no overshoot). Visible well before t=0.5s.
        tl.fromTo(
          "#i03-phone",
          { y: 620, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.78, ease: "power3.out" },
          0.08
        );

        // Continuous camera push onto the screenshot: the phone keeps growing
        // toward the lens for the whole frame so the app screen reads clearly.
        tl.fromTo(
          "#i03-phone",
          { scale: 1 },
          { scale: 1.26, y: -46, duration: 2.05, ease: "power1.inOut", transformOrigin: "50% 26%" },
          0.9
        );

        /* ============ Scene 2 (1.12–2.09) — wordmark reveals per word ============ */

        // dynamic-content-sequencing: staggered, index-derived token reveal of
        // the lockup ("Pro" / "Feeder" / ".ag" — the .ag lands in gold).
        ["#i03-w1", "#i03-w2", "#i03-w3"].forEach(function (sel, i) {
          tl.fromTo(
            sel,
            { y: 42, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
            1.12 + i * 0.11
          );
        });

        /* ============ Scene 3 (2.09–2.987) — tagline lands, everything holds ============ */

        tl.fromTo(
          "#i03-tagline",
          { y: 22, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" },
          2.09
        );

        // Subtle jitter on the phone while it holds (sine-wave-loop, low
        // amplitude, finite single cycle — sin(0)=0 and sin(2π)=0, so there is
        // no jump into or out of the settled state).
        var jit = { p: 0 };
        tl.to(
          jit,
          {
            p: Math.PI * 2,
            duration: 0.55,
            ease: "none",
            onUpdate: function () {
              gsap.set("#i03-phone-jit", { y: Math.sin(jit.p) * 2 });
            },
          },
          2.35
        );

        window.__timelines["03-intro"] = tl;
