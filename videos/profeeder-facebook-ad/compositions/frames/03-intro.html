      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        // Measure the two check ticks so the stroke-draw matches real geometry.
        ["i03-tick1", "i03-tick2"].forEach(function (id) {
          var p = document.getElementById(id);
          var len = p.getTotalLength();
          p.style.strokeDasharray = String(len);
          p.style.strokeDashoffset = String(len);
        });

        var tl = gsap.timeline({ paused: true });

        /* ============ Scene 1 (0.0–1.5) — phone rises, gold disc resolves ============ */

        // Gold haze breathes in first — atmosphere before structure.
        tl.fromTo(
          "#i03-haze",
          { opacity: 0 },
          { opacity: 1, duration: 0.9, ease: "power2.out" },
          0.05
        );

        // Accent disc scales up behind the phone (scale-swap-transition, restrained
        // incoming form: grow + fade in, smooth settle, no overshoot).
        tl.fromTo(
          "#i03-disc",
          { scale: 0.55, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
          0.08
        );

        // Phone slides up from the lower edge and settles (spring-pop-entrance,
        // smooth long-tail power3.out — no overshoot). Visible well before t=0.5s.
        tl.fromTo(
          "#i03-phone",
          { y: 560, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.85, ease: "power3.out" },
          0.1
        );

        /* ============ Scene 2 (1.5–2.8 → compressed) — wordmark + row ticks ============ */

        // Wordmark reveals per token (dynamic-content-sequencing: staggered,
        // index-derived reveal of the lockup's tokens; .ag lands in gold).
        ["#i03-w1", "#i03-w2", "#i03-w3"].forEach(function (sel, i) {
          tl.fromTo(
            sel,
            { y: 42, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
            1.12 + i * 0.12
          );
        });

        // Two checklist rows tick complete: gold fill blooms, check draws
        // (svg-path-draw: strokeDashoffset len -> 0, power2.out — pens don't bounce).
        tl.to("#i03-fill1", { opacity: 1, duration: 0.2, ease: "power1.out" }, 1.5);
        tl.to("#i03-tick1", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 1.55);
        tl.to("#i03-row1", { opacity: 0.62, duration: 0.3, ease: "power1.out" }, 1.7);

        tl.to("#i03-fill2", { opacity: 1, duration: 0.2, ease: "power1.out" }, 1.9);
        tl.to("#i03-tick2", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 1.95);
        tl.to("#i03-row2", { opacity: 0.62, duration: 0.3, ease: "power1.out" }, 2.1);

        /* ============ Scene 3 (2.35–end) — tagline lands, everything holds ============ */

        tl.fromTo(
          "#i03-tagline",
          { y: 22, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
          2.35
        );

        // Subtle jitter on the phone while it holds (sine-wave-loop, low amplitude,
        // finite single cycle — sin(0)=0 and sin(2π)=0, so no jump in or out).
        var jit = { p: 0 };
        tl.to(
          jit,
          {
            p: Math.PI * 2,
            duration: 0.5,
            ease: "none",
            onUpdate: function () {
              gsap.set("#i03-phone-jit", { y: Math.sin(jit.p) * 2 });
            },
          },
          2.45
        );

        window.__timelines["03-intro"] = tl;
      </script>
