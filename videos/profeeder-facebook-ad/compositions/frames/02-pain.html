    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ------- blur proxies (tween a plain object, write the SVG attr) ------- */
      const blur1 = document.getElementById("p2-blur1");

      /* scribble strike: seed dash state at init */

      const strikeLen = strike.getTotalLength();
