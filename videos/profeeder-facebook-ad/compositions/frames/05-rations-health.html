      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const DUR = 4.779;

        /* ── Scene 1 (0.0–2.0s): "blend custom rations on the fly" —
               phone assembles into the LEFT slot (center-outward-expansion,
               direct-into-slot form: fade + short slide into place) ── */

        // sun bloom establishes early (frame never reads flat)
        tl.fromTo(
          "#f05-bloom",
          { opacity: 0, scale: 0.94 },
          { opacity: 0.55, scale: 1, duration: 0.9, ease: "power2.out" },
          0
        );

        // chrome settles in quietly
        tl.fromTo(
          "#f05-toplabel",
          { opacity: 0, y: -10 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          0.05
        );
        tl.fromTo(
          "#f05-pagenum",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power1.out" },
          0.1
        );

        // phone: short slide directly into its slot, settling level
        tl.fromTo(
          "#f05-phone",
          { opacity: 0, x: -64, y: 30, rotation: -2.5, scale: 0.94 },
          {
            opacity: 1,
            x: 0,
            y: 0,
            rotation: 0,
            scale: 1,
            duration: 0.75,
            ease: "power3.out",
          },
          0.1
        );

        // gold callout chip pops above the phone…
        tl.fromTo(
          "#f05-callout",
          { opacity: 0, y: 16, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
          0.95
        );

        // …then discrete-text-sequence (smooth character slice) types it out
        const calloutEl = document.getElementById("f05-callout-text");
        const CALLOUT = "13.9% protein · blended live";
        const cState = { n: 0 };
        tl.to(
          cState,
          {
            n: CALLOUT.length,
            duration: 0.9,
            ease: "power1.inOut",
            onUpdate: () => {
              calloutEl.textContent = CALLOUT.substring(0, Math.floor(cState.n));
            },
          },
          1.05
        );

        /* ── Scene 2 (2.0–3.6s): "health schedules" — HEALTH card assembles
               into the RIGHT slot the same way; rows arrive; on "never slip
               again" the checks draw in gold (svg-path-draw) ── */

        tl.fromTo(
          "#f05-card",
          { opacity: 0, x: 64, y: 30, rotation: 2.5, scale: 0.94 },
          {
            opacity: 1,
            x: 0,
            y: 0,
            rotation: 0,
            scale: 1,
            duration: 0.7,
            ease: "power3.out",
          },
          2.05
        );

        // reminder rows: staggered short slide into place
        tl.fromTo(
          "#f05-row-matrix",
          { opacity: 0, x: 26 },
          { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" },
          2.45
        );
        tl.fromTo(
          "#f05-row-wormer",
          { opacity: 0, x: 26 },
          { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" },
          2.62
        );

        // svg-path-draw: measured dash pattern, checks trace in gold
        ["f05-check-matrix", "f05-check-wormer"].forEach((id) => {
          const p = document.getElementById(id);
          const len = p.getTotalLength();
          p.style.strokeDasharray = String(len);
          p.style.strokeDashoffset = String(len);
        });
        tl.to(
          "#f05-check-matrix",
          { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
          3.25
        );
        tl.to(
          "#f05-check-wormer",
          { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" },
          3.5
        );

        // dim-by-position: the already-done row recedes once its check lands
        tl.to(
          "#f05-row-wormer",
          { opacity: 0.55, duration: 0.4, ease: "power1.inOut" },
          3.75
        );

        /* ── Scene 3 (3.6–4.5s): both HOLD level; ambient-glow-bloom
               (traveling form) — ONE gold pass across the pair, then dies ── */

        // single finite pass: band enters fully off the left edge of the
        // clipped region and exits fully off the right; no loop, no return
        tl.fromTo(
          "#f05-sweep",
          { x: -260, opacity: 0 },
          { x: 940, opacity: 0.22, duration: 1.0, ease: "none" },
          3.7
        );
        // trailing fade so the band dies out exactly as it clears the edge
        tl.to(
          "#f05-sweep",
          { opacity: 0, duration: 0.3, ease: "power1.in" },
          4.4
        );

        /* ── multi-phase-camera: slow push-in under Scenes 2–3, easing to a
               stop so the pair holds still to the end ── */

        const cam = document.getElementById("f05-cam");
        const phase = { s: 1 };
        // Continual push onto the ration screenshot so it reads clearly.
        tl.to(phase, { s: 1.1, duration: 2.0, ease: "power1.inOut" }, 1.4);
        tl.to(phase, { s: 1.32, duration: 1.3, ease: "power1.out" }, 3.4);
        // page chrome retires as the camera closes in (keeps the keep-out clean)
        tl.to("#f05-pagenum", { opacity: 0, duration: 0.4, ease: "power1.out" }, 2.6);

        // continuous deterministic micro-drift (Lissajous) + phase scale
        const drift = { p: 0 };
        tl.to(
          drift,
          {
            p: Math.PI * 2 * 1.2,
            duration: DUR,
            ease: "none",
            onUpdate: () => {
              const dx = Math.sin(drift.p) * 3.5;
              const dy = Math.sin(drift.p * 1.3) * 2.2;
              cam.style.transform =
                "scale(" + phase.s + ") translate(" + dx + "px, " + dy + "px)";
            },
          },
          0
        );

        window.__timelines["05-rations-health"] = tl;
      </script>
